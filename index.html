renderer.domElement.addEventListener('pointermove',e=>{let p=target(e);marker.visible=!!p&&running;if(p)marker.position.set(p.x,.4,p.z)});
renderer.domElement.addEventListener('pointerdown',e=>{if(!running||e.button!==0)return;let p=target(e);if(!p)return;if(tool==='sword'){attack(p);return}if(tool!=='hook'){buildAt(p);return}if(hook){hook.returning=true;return}let max=9+s.hook*3,dx=p.x-s.x,dz=p.z-s.z,d=Math.hypot(dx,dz);if(d>max){dx*=max/d;dz*=max/d}hook={x:s.x,z:s.z,tx:s.x+dx,tz:s.z+dz,returning:false,hold:0,caught:null};line.visible=true});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom+Math.sign(e.deltaY)*2,9,29);resize()},{passive:false});
function gather(){let n=nodes.filter(n=>n.cd<=0&&dist(n,s)<2.7).sort((a,b)=>dist(a,s)-dist(b,s))[0];if(n){n.cd=45;n.m.visible=false;gain(n.type,n.type==='wood'?4:2);notify('采集 '+names[n.type]);return}let d=debris.find(d=>dist(d,s)<1.8);if(d)pickup(d);else notify('附近没有可采集资源')}
function eat(){if(s.inv.fish){s.inv.fish--;s.food=Math.min(100,s.food+30);notify('饥饿值恢复')}else notify('没有食物')}
function drink(){if(s.inv.fresh){s.inv.fresh--;s.water=Math.min(100,s.water+40);notify('水分恢复')}else notify('没有淡水')}
const keys=new Set();window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;let k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k))e.preventDefault();keys.add(k);if(e.repeat)return;if(k==='escape'){toggle();return}if(!running)return;if(/^[1-7]$/.test(k))setTool(tools[Number(k)-1][0]);if(k==='b')$('craft').hidden=!$('craft').hidden;if(k==='e')gather();if(k==='f')eat();if(k==='r')drink();if(k===' ')attack(s)});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(k)};b.onpointerup=b.onpointercancel=()=>keys.delete(k)});
$('eatBtn').onclick=()=>{if(running)eat()};$('drinkBtn').onclick=()=>{if(running)drink()};$('gatherBtn').onclick=()=>{if(running)gather()};
function save(quiet=false){if(!started)return;try{localStorage.setItem(KEY,JSON.stringify(s));$('saveStatus').textContent='已保存 '+new Date().toLocaleTimeString();if(!quiet)notify('存档成功')}catch(e){$('saveStatus').textContent='保存失败，请导出存档';if(!quiet)notify('本地存储不可用')}}
function resetWorld(){hook=null;line.visible=false;clearGroup(debrisGroup);clearGroup(enemyGroup);debris=[];enemies=[];spawn=enemySpawn=auto=saveTimer=0;attackCD=0;buildRaft();world();for(let i=0;i<65;i++)addDebris(true);player.position.set(s.x,.4,s.z);updateUI()}
function start(state){s=state;started=true;running=!s.dead;resetWorld();$('menu').hidden=running;if(s.dead)showDead();else save(true)}
function toggle(){if(!started||s.dead)return;running=!running;keys.clear();$('menu').hidden=running;if(!running){$('menuText').textContent='航行暂停。你可以继续游戏或开启新世界。';$('continueBtn').textContent='继续航行';$('continueBtn').disabled=false;save(true)}}
function showDead(){running=false;s.dead=true;save(true);$('menu').hidden=false;$('menuText').textContent='本次航行结束：生存 '+day()+' 天，击败 '+s.kills+' 只海怪。新建世界可以重新开始。';$('continueBtn').disabled=true}
$('continueBtn').onclick=()=>{if(started){toggle()}else{let a=readSave();if(a&&!a.dead)start(a)}};
$('newBtn').onclick=()=>{if((started||readSave())&&!confirm('新建世界将覆盖当前本地存档，确定吗？'))return;start(fresh())};
$('pauseBtn').onclick=toggle;$('saveBtn').onclick=()=>save();$('craftBtn').onclick=()=>{$('craft').hidden=!$('craft').hidden};
$('exportBtn').onclick=()=>{if(!started){notify('请先开始游戏');return}let u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='ocean-muck-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>1000000)throw Error('存档过大');let v=validate(JSON.parse(await f.text()));if((started||readSave())&&!confirm('导入会覆盖当前本地存档，确定吗？'))return;start(v);notify('存档导入成功')}catch(err){notify('导入失败：'+err.message)}finally{e.target.value=''}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(running)toggle();save(true)}});window.addEventListener('pagehide',()=>save(true));
const day=()=>Math.floor(s.time/DAY)+1,night=()=>s.time%DAY>105;
function updateUI(){let t=s.time%DAY/DAY*24+6,h=Math.floor(t)%24,m=Math.floor((t%1)*60);$('clock').textContent='第 '+day()+' 天 · '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+(night()?' 🌙':' ☀');for(const [id,label,val] of [['hp','生命',s.hp],['food','饥饿',s.food],['water','水分',s.water]]){$(id).style.width=clamp(val,0,100)+'%';$(id+'Text').textContent=label+' '+Math.ceil(val)+'/100'}$('resources').textContent='';for(const [k,v] of Object.entries(names)){let el=document.createElement('span');el.textContent=v+' '+s.inv[k];$('resources').append(el)}$('quest').textContent='木筏 '+s.tiles.length+' 格 · 击败 '+s.kills+' 只海怪\n'+(night()?'夜晚：切换武器抵御海怪！':s.devices.length?'探索岛屿并升级装备':'目标：建造净水器与收集网')}
function resize(){let w=innerWidth,h=innerHeight,asp=w/h;camera.left=-zoom*asp/2;camera.right=zoom*asp/2;camera.top=zoom/2;camera.bottom=-zoom/2;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();
function step(dt){s.time+=dt;attackCD=Math.max(0,attackCD-dt);let ax=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),az=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));let speed=tileAt(s.x,s.z)||landAt(s.x,s.z)?5:2.5;if(ax||az){let l=Math.hypot(ax,az);s.x=clamp(s.x+(ax+az)*.707/l*speed*dt,-190,190);s.z=clamp(s.z+(az-ax)*.707/l*speed*dt,-190,190);player.rotation.y=Math.atan2(ax+az,az-ax)}let swim=!tileAt(s.x,s.z)&&!landAt(s.x,s.z);player.position.set(s.x,swim?-.43:.43,s.z);
 s.food=Math.max(0,s.food-dt*.19);s.water=Math.max(0,s.water-dt*.24);if(!s.food||!s.water)s.hp-=dt*1.6;else if(s.food>65&&s.water>65)s.hp=Math.min(100,s.hp+dt*.4);
 if((spawn+=dt)>.48){spawn=0;addDebris()}
 for(let d of [...debris]){if(hook&&hook.caught===d)continue;d.z-=dt*.7;d.x+=Math.sin(s.time*.4+d.phase)*dt*.12;d.m.position.set(d.x,Math.sin(s.time*2+d.phase)*.08,d.z);if(dist(d,s)>38){remove(debrisGroup,d.m);debris=debris.filter(a=>a!==d);continue}if(dist(d,s)<.7&&swim)pickup(d)}
 if(hook){let h=hook,tx=h.returning?s.x:h.tx,tz=h.returning?s.z:h.tz,d=Math.hypot(tx-h.x,tz-h.z),v=Math.min(d,dt*(h.returning?18:22));if(d>.001){h.x+=(tx-h.x)*v/d;h.z+=(tz-h.z)*v/d}if(!h.caught){let a=debris.find(a=>dist(a,h)<1.05);if(a){h.caught=a;h.returning=true}}if(h.caught){h.caught.x=h.x;h.caught.z=h.z;h.caught.m.position.set(h.x,.12,h.z)}if(d<.3){if(h.returning){if(h.caught)pickup(h.caught);hook=null;line.visible=false}else if((h.hold+=dt)>.35)h.returning=true}if(hook){line.geometry.attributes.position.setXYZ(0,s.x,.95,s.z);line.geometry.attributes.position.setXYZ(1,h.x,.13,h.z);line.geometry.attributes.position.needsUpdate=true;line.geometry.computeBoundingSphere()}}
 for(let n of nodes){if(n.cd>0){n.cd-=dt;if(n.cd<=0)n.m.visible=true}}
 if((auto+=dt)>8){auto=0;for(let [x,z,t] of s.devices){if(t==='purifier')gain('fresh');if(t==='fishing')gain('fish');if(t==='net'){let d=debris.find(d=>dist(d,{x:x*2,z:z*2})<5);if(d&&(!hook||hook.caught!==d))pickup(d);else gain(Math.random()<.5?'wood':'plastic')}}}
 if(night()){if((enemySpawn+=dt)>Math.max(2,7-day()*.35)){enemySpawn=0;enemyAdd()}}else enemySpawn=0;
 for(let e of [...enemies]){e.cd-=dt;e.m.scale.lerp(new THREE.Vector3(1,1,1),dt*7);let d=dist(e,s);if(!night()){e.x+=(e.x-s.x)/(d||1)*dt*3;e.z+=(e.z-s.z)/(d||1)*dt*3;if(d>22){remove(enemyGroup,e.m);enemies=enemies.filter(a=>a!==e);continue}}else if(d>1.1){let v=dt*Math.min(3.1,1.3+day()*.1);e.x+=(s.x-e.x)/d*v;e.z+=(s.z-e.z)/d*v}else if(e.cd<=0){e.cd=1.5;s.hp-=4+Math.min(day(),12);notify('受到海怪攻击！')}e.m.position.set(e.x,Math.sin(s.time*4)*.12,e.z)}
 if((saveTimer+=dt)>15){saveTimer=0;save(true)}if((uiTimer+=dt)>.2){uiTimer=0;updateUI()}if(s.hp<=0){s.hp=0;updateUI();showDead()}}
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-(frame.last||now))/1000);frame.last=now;if(running)step(dt);let dark=night()?.78:0;hemi.intensity=2.1-dark*1.7;sun.intensity=2-dark*1.8;scene.background.set( night()?0x163450:0x94dfe7);scene.fog.color.copy(scene.background);ocean.material.color.set(night()?0x18516f:0x269eb6);
 camera.position.set(s.x+14,22,s.z+14);camera.lookAt(s.x,0,s.z);sun.position.set(s.x-15,25,s.z+10);sun.target.position.set(s.x,0,s.z);
 waves.position.set(Math.floor(s.x/25)*25,0,Math.floor(s.z/25)*25);renderer.render(scene,camera)}
let saved=readSave();$('continueBtn').textContent=saved&&!saved.dead?'继续上次航行':'没有可继续的存档';$('continueBtn').disabled=!saved||saved.dead;$('newBtn').disabled=false;setTool('hook');resetWorld();requestAnimationFrame(frame);
</script></body></html>
